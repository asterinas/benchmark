<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, minimum-scale=1.0, initial-scale=1, user-scalable=yes" />
    <style>
      html {
          font-family: BlinkMacSystemFont,-apple-system,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,"Fira Sans","Droid Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
          -webkit-font-smoothing: antialiased;
          background-color: #fff;
          font-size: 16px;
      }
      body {
          color: #4a4a4a;
          margin: 8px;
          font-size: 1em;
          font-weight: 400;
      }
      header {
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
      }
      main {
          width: 100%;
          display: flex;
          flex-direction: column;
      }
      a {
          color: #3273dc;
          cursor: pointer;
          text-decoration: none;
      }
      a:hover {
          color: #000;
      }
      button {
          color: #fff;
          background-color: #3298dc;
          border-color: transparent;
          cursor: pointer;
          text-align: center;
      }
      button:hover {
          background-color: #2793da;
          flex: none;
      }
      .spacer {
          flex: auto;
      }
      .small {
          font-size: 0.75rem;
      }
      footer {
          margin-top: 16px;
          display: flex;
          align-items: center;
      }
      .header-label {
          margin-right: 4px;
      }
      .benchmark-set {
          margin: 8px 0;
          width: 100%;
          display: flex;
          flex-direction: column;
      }
      .benchmark-title {
          font-size: 3rem;
          font-weight: 600;
          word-break: break-word;
          text-align: center;
          margin-bottom: 5px;
      }
      .benchmark-graphs {
          display: flex;
          flex-direction: row;
          justify-content: space-around;
          align-items: center;
          flex-wrap: wrap;
          width: 100%;
      }
      .benchmark-chart-overview {
          display: flex;
          flex-direction: column;
          max-width: 90%;
          width: auto; /* Make width adaptive */
          min-width: 1000px; /* Set minimum width to 1000px */
          background-color: #ffffff; /* White background for better chart display */
          box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); /* Slight shadow */
      }
      .chart-container {
          position: relative;
          width: 80%;
          margin: 0 auto;
      }
      .chart-container canvas {
          display: block;
          max-width: 100%;
          min-width: 0;
          width: 100%;
      }
      .chart-description {
          font-family: 'Courier New', Courier, monospace;
          color: #333; /* Changed to a darker color for better readability */
          font-style: italic;
          font-size: 0.9rem;
          font-weight: 200;
          word-break: break-word;
          text-align: center;
          margin-top: 0px; /* Added margin to create space between the title and the description */
          margin-bottom: 20px; /* Added margin to create space between the description and the figure below it */
      }
    </style>
    <title>Benchmarks</title>
  </head>

  <body>
    <header id="header">
      <div class="header-item">
        <strong class="header-label">Last Update:</strong>
        <span id="last-update"></span>
      </div>
      <div class="header-item">
        <strong class="header-label">Repository:</strong>
        <a id="repository-link" rel="noopener"></a>
      </div>
    </header>
    <main id="main"></main>
    <footer>
      <button id="dl-button">Download data as JSON</button>
      <div class="spacer"></div>
      <div class="small">Powered by <a rel="noopener" href="https://github.com/marketplace/actions/continuous-benchmark">github-action-benchmark</a></div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.1.0/dist/chartjs-plugin-annotation.min.js"></script>
    <script id="main-script">
      'use strict';
      (function() {
        const dataPaths = [
          'lmbench/data.js',
          'iperf3/data.js',
          'nginx/data.js',
          'sysbench/data.js',
          'redis/data.js',
          'fio/data.js',
          'sqlite/data.js',
          'hackbench/data.js',
          'schbench/data.js',
          'memcached/data.js',
        ];

        function numericValue(value) {
          if (typeof value !== 'number' && typeof value !== 'string') return null;
          if (typeof value === 'string' && value.trim() === '') return null;
          const number = Number(value);
          return Number.isFinite(number) && number >= 0 ? number : null;
        }

        function getComparison(entry) {
          const linux = entry.benches.filter(bench => bench.extra === 'linux_result');
          const aster = entry.benches.filter(bench => bench.extra === 'aster_result');
          if (linux.length !== 1 || aster.length !== 1 || linux[0].unit !== aster[0].unit) {
            return null;
          }
          const linuxValue = numericValue(linux[0].value);
          const asterValue = numericValue(aster[0].value);
          if (linuxValue === null || asterValue === null || linuxValue <= 0 || asterValue <= 0) {
            return null;
          }
          let ratio;
          if (entry.tool === 'customBiggerIsBetter') ratio = asterValue / linuxValue;
          else if (entry.tool === 'customSmallerIsBetter') ratio = linuxValue / asterValue;
          else return null;
          return Number.isFinite(ratio) && ratio > 0 ? ratio : null;
        }

        function appendText(parent, tag, className, text) {
          const element = document.createElement(tag);
          element.className = className;
          element.textContent = text;
          parent.appendChild(element);
          return element;
        }

        function renderOverview(parent, benchmarks) {
          const labelCharacters = 65;
          // Keep test identity separate from its title; titles need not be unique.
          const included = benchmarks.filter(benchmark => benchmark.latestEntry.display);
          const comparisons = included.map(benchmark => ({
            name: benchmark.name,
            title: benchmark.latestEntry.title,
            ratio: getComparison(benchmark.latestEntry),
          }));
          const valid = comparisons.filter(comparison => comparison.ratio !== null);
          appendText(parent, 'div', 'chart-description',
            'For bandwidth, use Asterinas / Linux; for latency, use Linux / Asterinas. The higher, the better.');
          const invalid = comparisons.filter(comparison => comparison.ratio === null);
          if (invalid.length > 0) {
            appendText(parent, 'div', 'chart-description',
              'Latest comparison unavailable: ' + invalid.map(comparison => comparison.name).join(', ') + '.');
          }
          const labels = comparisons.map(comparison => comparison.title);
          const barValues = comparisons.map(comparison => comparison.ratio);
          // Keep the mean row in empty charts without inventing a measured value.
          labels.push('Geometric Mean');
          barValues.push(valid.length > 0
            ? Math.exp(valid.reduce((sum, comparison) => sum + Math.log(comparison.ratio), 0) / valid.length)
            : null);
          const container = document.createElement('div');
          container.className = 'chart-container';
          container.style.height = (25 * (comparisons.length + 2) + 20) + 'px';
          parent.appendChild(container);
          const canvas = document.createElement('canvas');
          canvas.className = 'benchmark-chart-overview';
          container.appendChild(canvas);
          new Chart(canvas, {
            type: 'bar',
            data: {
              labels,
              datasets: [{
                label: 'Asterinas',
                data: barValues,
                backgroundColor: 'rgba(54, 162, 235, 0.2)',
                borderColor: 'rgb(54, 162, 235)',
                borderWidth: 1,
              }],
            },
            options: {
              indexAxis: 'y',
              scales: {
                x: { beginAtZero: true, reverse: true },
                y: {
                  position: 'right',
                  ticks: {
                    padding: 10,
                    autoSkip: false,
                    // Equal-width labels keep the zero aligned across all suites.
                    callback: function(value) {
                      return this.getLabelForValue(value).slice(0, labelCharacters).padEnd(labelCharacters, ' ');
                    },
                    font: context => ({
                      family: 'Consolas, monospace',
                      weight: context.tick.label.trim() === 'Geometric Mean' ? 'bold' : 'normal',
                      size: 12,
                    }),
                  },
                },
              },
              plugins: {
                annotation: {
                  annotations: {
                    reference: {
                      type: 'line',
                      xMin: 1,
                      xMax: 1,
                      borderColor: 'rgba(0, 0, 0, 0.5)',
                      borderWidth: 2,
                    },
                  },
                },
              },
              barPercentage: 0.6,
              responsive: true,
              maintainAspectRatio: false,
            },
          });
        }

        async function init() {
          const loaded = await Promise.all(dataPaths.map(async path => {
            try {
              const response = await fetch(path);
              if (!response.ok) throw new Error('HTTP ' + response.status);
              const text = await response.text();
              const data = JSON.parse(text.replace(/^window\.BENCHMARK_DATA\s*=\s*/, ''));
              return { name: path.split('/')[0], data };
            } catch (error) {
              return { name: path.split('/')[0], error };
            }
          }));
          const main = document.getElementById('main');
          const available = loaded.filter(suite => !suite.error);
          if (available.length > 0) {
            const lastUpdate = Math.max(...available.map(suite => suite.data.lastUpdate));
            document.getElementById('last-update').textContent = new Date(lastUpdate).toString();
            const repoLink = document.getElementById('repository-link');
            repoLink.href = available[0].data.repoUrl;
            repoLink.textContent = available[0].data.repoUrl;
          }
          document.getElementById('dl-button').onclick = () => {
            const anchor = document.createElement('a');
            const data = {};
            available.forEach(suite => { data[suite.name] = suite.data; });
            anchor.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(data, null, 2));
            anchor.download = 'benchmark_data.json';
            anchor.click();
          };
          for (const suite of loaded) {
            const section = document.createElement('div');
            section.className = 'benchmark-set';
            section.id = suite.name;
            main.appendChild(section);
            const title = appendText(section, 'h1', 'benchmark-title', '');
            const link = appendText(title, 'a', '', suite.name);
            link.href = new URL(suite.name + '/', window.location.href).href;
            link.target = '_blank';
            link.rel = 'noopener';
            appendText(title, 'span', '', ': Normalized performance of Asterinas');
            if (suite.error) {
              appendText(section, 'div', 'chart-description',
                'Results unavailable: ' + suite.name + ' (' + suite.error.message + ').');
              continue;
            }
            const benchmarks = Object.entries(suite.data.entries)
              .filter(([, history]) => history.length > 0)
              .map(([name, history]) => ({ name, latestEntry: history[history.length - 1] }));
            renderOverview(section, benchmarks);
          }
        }

        init().catch(error => {
          appendText(document.getElementById('main'), 'div', 'chart-description',
            'Unable to render benchmark overview: ' + error.message + '.');
        });
      })();
    </script>
  </body>
</html>
